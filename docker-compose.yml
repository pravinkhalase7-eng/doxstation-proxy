# Public :80/:443 for all doxstation.com hosts.
# Apps stay in their own Compose projects; this proxy only talks to host ports.
name: doxstation

services:
  edge:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: doxstation-edge:${IMAGE_TAG:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-play.doxstation.com}
      PLAY_WEB_PORT: ${PLAY_WEB_PORT:-3010}
      PLAY_API_PORT: ${PLAY_API_PORT:-8010}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - /var/www/html:/var/www/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q HTTP"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
