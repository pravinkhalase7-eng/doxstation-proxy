# Public vhosts on host :80.
# - play.doxstation.com → AI Coder host ports (Jenkins :3010 / :8010)
# - doxstation.com → AI Teacher via host-published :3000 / :8000
# - shorts.doxstation.com → Short Video Maker via host-published :3123
# - docvault.doxstation.com → DocVault via host-published :8088
# - manager.doxstation.com → Env Manager via host-published :3050
# - quiz.doxstation.com → Ignite Quiz via host-published :4173
# ACME challenges must be served here before Let's Encrypt will issue TLS.

upstream aiteacher_web {
    server host.docker.internal:3000;
}

upstream aiteacher_api {
    server host.docker.internal:8000;
}

upstream shortvideo_app {
    server host.docker.internal:3123;
}

upstream docvault_app {
    server host.docker.internal:8088 max_fails=1 fail_timeout=5s;
    server host.docker.internal:8089 max_fails=1 fail_timeout=5s backup;
}

upstream envmanager_app {
    server host.docker.internal:3050;
}

upstream ignite_quiz_app {
    server host.docker.internal:4173;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    default_type text/plain;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 404 "unknown host\n";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name play.doxstation.com;
    client_max_body_size 32m;
    include /etc/nginx/play.inc;
}

# Apex domain → AI Teacher (do not start a second nginx on :80).
server {
    listen 80;
    listen [::]:80;
    server_name doxstation.com www.doxstation.com;
    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://aiteacher_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://aiteacher_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}

# shorts.doxstation.com → Short Video Maker (do not start a second nginx on :80).
server {
    listen 80;
    listen [::]:80;
    server_name shorts.doxstation.com;
    client_max_body_size 200m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://shortvideo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}

# docvault.doxstation.com → DocVault (do not send unknown hosts to Byte).
server {
    listen 80;
    listen [::]:80;
    server_name docvault.doxstation.com;
    client_max_body_size 60m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://docvault_app;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}

# manager.doxstation.com → Env Manager (do not bind Env Manager to :80).
server {
    listen 80;
    listen [::]:80;
    server_name manager.doxstation.com;
    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
